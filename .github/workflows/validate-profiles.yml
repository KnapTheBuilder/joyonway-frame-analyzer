name: Validate JSON profiles

on:
  push:
    paths:
      - 'profiles/*.json'
  pull_request:
    paths:
      - 'profiles/*.json'

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Validate JSON syntax
        run: |
          for f in profiles/*.json; do
            echo "Validating $f"
            python -m json.tool "$f" > /dev/null
          done
          echo "All JSON files are valid"

      - name: Check required fields
        run: |
          python3 << 'EOF'
          import json
          import sys
          import glob

          required_top = ['id', 'name', 'status', 'physical', 'frame_format']
          required_physical = ['baudrate']
          required_frame = ['delimiter_start', 'delimiter_end', 'type_byte_offset']

          errors = []
          for path in sorted(glob.glob('profiles/*.json')):
              if path.endswith('_template.json'):
                  continue
              with open(path) as f:
                  data = json.load(f)
              name = path.split('/')[-1]
              for k in required_top:
                  if k not in data:
                      errors.append(f"{name}: missing top-level key '{k}'")
              for k in required_physical:
                  if k not in data.get('physical', {}):
                      errors.append(f"{name}: missing physical.{k}")
              for k in required_frame:
                  if k not in data.get('frame_format', {}):
                      errors.append(f"{name}: missing frame_format.{k}")

          if errors:
              print("VALIDATION ERRORS:")
              for e in errors:
                  print(f"  - {e}")
              sys.exit(1)
          print("All profiles have required fields")
          EOF
