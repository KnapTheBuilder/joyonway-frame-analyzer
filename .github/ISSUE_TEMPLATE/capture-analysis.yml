name: Capture analysis / Byte decoding
description: Share a decoded byte mapping or analysis result
title: "[Analysis] "
labels: ["analysis", "documentation"]
body:
  - type: input
    id: model
    attributes:
      label: Controller model
      placeholder: "P23B32"
    validations:
      required: true

  - type: dropdown
    id: command
    attributes:
      label: Command type analyzed
      options:
        - "B4 (broadcast state)"
        - "A1 (setpoint or pump command)"
        - "A5 (module poll)"
        - "AA (module response)"
        - "2E (temperature response)"
        - "Other"
    validations:
      required: true

  - type: textarea
    id: byte_mapping
    attributes:
      label: Byte mapping
      description: Which bytes do what, with confidence level
      placeholder: |
        byte 9 = water temp in F (validated against 5 captures)
        byte 16 = setpoint in F (validated against 3 setpoint changes)
        byte 14 bit 0x10 = heater state (suspected, needs more data)
    validations:
      required: true

  - type: textarea
    id: evidence
    attributes:
      label: Evidence
      description: How you reached this conclusion (diffs, sample frames, etc.)
